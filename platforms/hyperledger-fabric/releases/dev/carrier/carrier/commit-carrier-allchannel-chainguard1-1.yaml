apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: commit-carrier-allchannel-chainguard1-1
  namespace: carrier-net
  annotations:
    fluxcd.io/automated: "false"
spec:
  interval: 1m
  releaseName: commit-carrier-allchannel-chainguard1-1
  chart:
    spec:
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-local
        namespace: flux-local
      chart: platforms/hyperledger-fabric/charts/fabric-chaincode-commit
  values:
    metadata:
      namespace: carrier-net
      network:
        version: 2.5.4
      images:
        fabrictools: ghcr.io/hyperledger/bevel-fabric-tools:2.5.4
        alpineutils: ghcr.io/hyperledger/bevel-alpine:latest

    peer:
      name: peer0
      address: peer0.carrier-net:7051
      localmspid: carrierMSP
      loglevel: debug
      tlsstatus: true
    vault:
      role: vault-role
      address: http://192.168.49.1:8200
      authpath: localcarrier
      adminsecretprefix: secretsv2/data/localcarrier/users/admin
      secretpath: secretsv2
      serviceaccountname: vault-auth
      type: hashicorp
      imagesecretname: ""
      tls: false
    orderer:
      address: orderer1.supplychain-net:7050
    chaincode:
      builder: hyperledger/fabric-ccenv:2.5.4
      name: chainguard
      version: 1
      sequence: 1
      commitarguments: '\"init\",\"\"'
      endorsementpolicies: ''
      initrequired: False
      repository:
        hostname: "github.com"
        git_username: "SainyGb"
        url: github.com/SainyGb/ChainGuard-Backend.git
        branch: env/api-prod-env
        path: asset-transfer-abac/chaincode-go/
      pdc:
        enabled: false
        collectionsconfig:  ""
    channel:
      name: allchannel
    endorsers:
      creator: carrier-net
      name:  carrier  manufacturer 
      corepeeraddress:  peer0.carrier-net:7051  peer0.manufacturer-net:7051 
      nameslist: 
        - name: carrier
        - name: manufacturer
