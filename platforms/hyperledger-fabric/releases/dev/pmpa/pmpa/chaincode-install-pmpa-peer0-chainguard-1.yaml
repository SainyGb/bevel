apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chaincode-install-pmpa-peer0-chainguard-1
  namespace: pmpa-net
  annotations:
    fluxcd.io/automated: "false"
spec:
  interval: 1m
  releaseName: chaincode-install-pmpa-peer0-chainguard-1
  chart:
    spec:
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-local
        namespace: flux-local
      chart: platforms/hyperledger-fabric/charts/fabric-chaincode-install
  values:
    metadata:
      namespace: pmpa-net
      network:
        version: 2.5.4
      images:
        fabrictools: ghcr.io/hyperledger/bevel-fabric-tools:2.5.4
        alpineutils: ghcr.io/hyperledger/bevel-alpine:latest

    peer:
      name: peer0
      address: peer0.pmpa-net:7051
      localmspid: pmpaMSP
      loglevel: debug
      tlsstatus: true
    vault:
      role: vault-role
      address: http://10.100.221.215:8200
      authpath: localpmpa
      adminsecretprefix: secretsv2/data/localpmpa/users/admin
      secretgitprivatekey: secretsv2/data/localpmpa/credentials/pmpa-net/git
      serviceaccountname: vault-auth
      type: hashicorp
      imagesecretname: ""
      tls: false
    chaincode:
      builder: hyperledger/fabric-ccenv:2.5.4
      name: chainguard
      version: 1
      lang: golang
      maindirectory: chaincode-go
      repository:
        hostname: "github.com"
        git_username: "SainyGb"
        url: github.com/SainyGb/ChainGuard-Backend.git
        branch: env/api-prod-env
        path: asset-transfer-abac/chaincode-go/
      endorsementpolicies:  ''