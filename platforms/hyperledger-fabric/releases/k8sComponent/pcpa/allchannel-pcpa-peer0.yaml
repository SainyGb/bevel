global:
  version: 2.5.4
  serviceAccountName: vault-auth
  cluster:
    provider: minikube
    cloudNativeServices: false
  vault:
    type: hashicorp
    network: fabric
    address: http://10.100.221.215:8200
    authPath: localpcpa
    secretEngine: secretsv2
    secretPrefix: "data/localpcpa"
    role: vault-role
    tls: false
  proxy:
    provider: none
    externalUrlSuffix: develop.local.com

image:
  fabricTools: ghcr.io/hyperledger/bevel-fabric-tools
  alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
  #fabricTools: ghcr.io/hyperledger/bevel-fabric-tools
  #alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
  pullSecret: ""

peer:
  name: peer0
  type: anchor
  address: peer0.pcpa-net:7051
  localMspId: pcpaMSP
  logLevel: debug
  tlsStatus: true
  channelName: allchannel  
  ordererAddress: orderer-pcpa.mppa-net:7050
  addPeerValue: false
  addnewOrgValue: false