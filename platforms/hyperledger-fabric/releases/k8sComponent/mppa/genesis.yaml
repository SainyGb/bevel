global:
  version: 2.5.4
  serviceAccountName: vault-auth
  cluster:
    provider: minikube
    cloudNativeServices: false
  vault:
    type: hashicorp
    network: fabric
    address: http://10.100.221.215:8200
    authPath: localmppa
    secretEngine: secretsv2
    secretPrefix: "data/localmppa"
    role: vault-role
    tls: false
  proxy:
    provider: none
    externalUrlSuffix: develop.local.com

image:
  alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
  fabricTools: ghcr.io/hyperledger/bevel-fabric-tools
  #alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
  #fabricTools: ghcr.io/hyperledger/bevel-fabric-tools
  pullSecret: ""

organizations:
  - name: mppa
    orderers:
    - name: orderer-mppa
      ordererAddress: orderer-mppa.mppa-net:7050
    peers:
    - name: peer0
      peerAddress: peer0.mppa-net:7051
  - name: pcpa
    orderers:
    - name: orderer-pcpa
      ordererAddress: orderer-pcpa.pcpa-net:7050
    peers:
    - name: peer0
      peerAddress: peer0.pcpa-net:7051
  - name: pmpa
    orderers:
    - name: orderer-pmpa
      ordererAddress: orderer-pmpa.pmpa-net:7050
    peers:
    - name: peer0
      peerAddress: peer0.pmpa-net:7051

consensus: raft


channels:
 
 
  - name: allchannel
    consortium: SupplyChainConsortium
    orderers: 
      - mppa
      - pcpa
      - pmpa
    participants:
      - mppa
      - pcpa
      - pmpa

settings:
  generateGenesis: True 
  removeConfigMapOnDelete: false

add_new_org: false
newOrgs:
  - name: mppa
  - name: pcpa
  - name: pmpa
